<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a1030">
<title>เลื่อนซิ่ง ส่งของขวัญ · Yoshi SPA</title>
<!-- xmas-yoshi.html — เกม ธ.ค. 69 ตัวจริงของโยชิ · หน้านี้ไม่มี Firebase คุยกับตัวกลาง prspa-game อย่างเดียว (สุ่ม/ออกคูปอง/อันดับ อยู่ที่เซิร์ฟเวอร์) -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="qrcode.min.js" onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';document.head.appendChild(s);"></script>
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Mitr:wght@400;500;600;700&display=swap">
<style>
/* Layout: one full-bleed 3D night street; UI floats above it in layers (HUD top · lane buttons bottom · cards centred) */
:root{
  color-scheme: dark;
  --night:#0a1030; --dusk:#1a2552; --snow:#f2f6ff; --berry:#e23a4e; --pine:#27a36b; --gold:#ffcc4d; --ice:#8fe6ff; --cheer:#ff4f9a;
  --ink:#0d1330; --panel:rgba(12,18,48,.86); --line:rgba(255,255,255,.18); --dim:rgba(242,246,255,.72);
  --shop:#9d174d;
  --f-display:'Mitr','Leelawadee UI','Thonburi','Noto Sans Thai',system-ui,sans-serif;
  --f-data:'Chakra Petch','Mitr','Leelawadee UI',system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--night);color:var(--snow);font-family:var(--f-display);font-size:16px;line-height:1.35;overflow:hidden;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ice);outline-offset:3px}
svg.ic{width:1em;height:1em;fill:currentColor;flex:none;display:block}
#app{position:relative;height:100%;overflow:hidden;background:var(--night)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shade{background:linear-gradient(180deg,rgba(10,16,48,.72),rgba(10,16,48,.9))}

/* ---------- home ---------- */
#home{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;text-align:center;
  background:linear-gradient(180deg,rgba(10,16,48,.7) 0%,rgba(10,16,48,.25) 30%,rgba(10,16,48,0) 42%,rgba(10,16,48,0) 56%,rgba(10,16,48,.9) 84%)}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.topbar .chip{min-width:48px;min-height:48px;justify-content:center;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:500}
.chip svg{font-size:18px}
.chip b{font-family:var(--f-data);font-weight:700}
.logo{height:46px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.title{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:1vh}
.eyebrow{font-family:var(--f-data);font-weight:700;letter-spacing:.06em;font-size:clamp(14px,3.9vw,18px);color:var(--ice);text-shadow:0 0 12px rgba(143,230,255,.7)}
h1{margin:0;font-size:clamp(54px,17vw,112px);line-height:1.22;font-weight:700;transform:rotate(-3deg);color:#fff;
  text-shadow:0 0 6px #fff,0 0 22px rgba(255,120,150,.95),0 0 46px rgba(226,58,78,.85),0 5px 0 rgba(120,14,40,.9)}
html[lang=en] h1{font-size:clamp(40px,13vw,92px)}
.tag{font-size:clamp(15px,4.4vw,21px);font-weight:500;text-shadow:0 2px 8px rgba(0,0,0,.8);text-wrap:balance}
.cta{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:420px;margin-top:auto;margin-bottom:1vh}
.btn-main{min-height:60px;padding:10px 44px;border-radius:999px;font-size:26px;font-weight:700;color:#3a2400;
  background:linear-gradient(180deg,#ffe38a,#ffb92e);box-shadow:0 6px 0 #b9660a,0 12px 26px rgba(255,170,40,.45);transition:transform .08s,box-shadow .08s}
.btn-main:active{transform:translateY(4px);box-shadow:0 2px 0 #b9660a,0 6px 14px rgba(255,170,40,.4)}
.btn-main.sm{min-height:52px;font-size:20px;padding:8px 28px}
.btn-ghost{min-height:46px;padding:8px 18px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:16px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn-ghost svg{font-size:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.note{font-size:13px;color:var(--dim);text-wrap:balance}
.prize{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;background:var(--panel);border:1.5px solid var(--gold);color:#ffe9a8;font-size:clamp(14px,4vw,17px);font-weight:500;box-shadow:0 0 14px rgba(255,204,77,.35)}
.prize svg{color:var(--gold);font-size:1.25em}
.besttxt{font-size:14px;color:var(--dim);text-shadow:0 1px 6px rgba(0,0,0,.85)}
.besttxt b{font-family:var(--f-data);font-weight:700;font-size:17px;color:var(--gold);margin-left:4px}
.proto{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,204,77,.16);border:1px dashed rgba(255,204,77,.6);color:var(--gold)}

/* ---------- HUD ---------- */
#hud{pointer-events:none;display:flex;flex-direction:column;gap:8px}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.score{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px 14px 6px;min-width:112px}
.score.cheer{border-color:var(--cheer);box-shadow:0 0 16px rgba(255,79,154,.55)}
.score.cheer b{color:#ff9cc8}
.x2{position:absolute;right:-14px;top:-9px;overflow:hidden;padding:4px 9px 8px;border-radius:12px;background:var(--cheer);color:#fff;font-family:var(--f-data);font-weight:700;font-size:17px;line-height:1;box-shadow:0 0 14px rgba(255,79,154,.8)}
.x2 i{position:absolute;left:0;bottom:0;width:100%;height:4px;background:#fff;transform-origin:left center}
.score .lbl{display:block;font-size:12px;color:var(--dim)}
.score b{display:block;font-family:var(--f-data);font-size:34px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold)}
.score b.pop{animation:pop .18s}
.score .spd{display:block;margin-top:3px;font-size:12px;color:var(--ice)}
.score .spd i{font-style:normal;font-family:var(--f-data);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
@keyframes pop{50%{transform:scale(1.14)}}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.hearts{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:24px;color:var(--berry)}
.hearts .off{color:rgba(255,255,255,.22)}
.hud-btn{pointer-events:auto;width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
.goal{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 12px 8px;min-width:190px;max-width:72vw}
.goal .boxes{display:flex;align-items:center;gap:6px;font-size:22px;color:rgba(255,255,255,.25)}
.goal .boxes .on{color:var(--berry)}
.goal .boxes span{font-size:13px;color:var(--dim);margin-left:4px}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pine),var(--gold));border-radius:9px}
#toast{position:absolute;left:50%;top:27%;transform:translate(-50%,0);padding:9px 20px;border-radius:999px;background:linear-gradient(180deg,#ffe38a,#ffb92e);color:#3a2400;
  font-size:19px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .25s,transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,-8px)}
#hint{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);font-size:19px;font-weight:600;padding:8px 18px;border-radius:999px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;opacity:0;transition:opacity .3s}
#hint.on{opacity:1}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(226,58,78,0) 40%,rgba(226,58,78,.7) 100%);transition:opacity .35s}
#flash.on{opacity:1;transition:none}
#ctl{pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end}
#ctl span{width:76px;height:76px;border-radius:50%;background:rgba(12,18,48,.5);border:2px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:34px;margin-bottom:6px}
#ctl span.hit{background:rgba(255,204,77,.45)}

/* ---------- cards (how-to · result · gifts · ranking · pause) ---------- */
.screen.center{display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:440px;max-height:100%;overflow-y:auto;touch-action:pan-y;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px 18px 20px;
  display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h2{margin:0;font-size:26px;font-weight:700;text-wrap:balance}
.big{font-family:var(--f-data);font-size:60px;line-height:1;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.sub{color:var(--dim);font-size:15px;text-wrap:balance}
.opens{display:flex;justify-content:center;align-items:center;gap:8px;font-size:34px;color:rgba(255,255,255,.22)}
.opens .on{color:var(--berry)}
.pill{align-self:center;padding:6px 14px;border-radius:999px;background:rgba(39,163,107,.22);border:1px solid rgba(39,163,107,.7);font-size:15px;font-weight:500}
.how{display:flex;flex-direction:column;gap:10px;text-align:left}
.how .it{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.07);border-radius:16px;padding:10px 12px}
.how .it p{margin:0;font-size:17px;font-weight:500;min-width:0}
.how .it small{display:block;font-size:13px;color:var(--dim);font-weight:400}
.demo{flex:none;width:92px;height:62px;border-radius:12px;background:#1d2545;position:relative;overflow:hidden}
.demo.lanes{background:linear-gradient(90deg,#1d2545 32%,rgba(255,255,255,.35) 32% 34%,#1d2545 34% 66%,rgba(255,255,255,.35) 66% 68%,#1d2545 68%)}
.demo .sl{position:absolute;bottom:8px;left:50%;width:22px;height:22px;margin-left:-11px;border-radius:6px;background:var(--berry);box-shadow:0 0 0 3px rgba(255,204,77,.9) inset;animation:lane 2.6s infinite ease-in-out}
.demo .tp{position:absolute;top:10px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#fff;opacity:.9;animation:lane 2.6s infinite ease-in-out}
@keyframes lane{0%,18%{transform:translateX(0)}30%,48%{transform:translateX(-30px)}62%,80%{transform:translateX(30px)}94%,100%{transform:translateX(0)}}
.demo.mid{display:grid;place-items:center;font-size:34px}
.demo .g1{color:var(--berry);animation:bob 1.1s infinite ease-in-out}
.demo .plus{position:absolute;right:8px;top:6px;font-family:var(--f-data);font-size:15px;font-weight:700;color:var(--gold);animation:rise 1.1s infinite}
@keyframes bob{50%{transform:translateY(-6px) scale(1.08)}}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}40%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.demo .sm{animation:shake 1.3s infinite}
@keyframes shake{0%,60%,100%{transform:translateX(0)}70%{transform:translateX(-4px) rotate(-6deg)}80%{transform:translateX(4px) rotate(6deg)}}
.demo .hb{position:absolute;right:7px;top:6px;font-size:17px;color:var(--berry);animation:blink 1.3s infinite}
@keyframes blink{0%,60%{opacity:1}75%,100%{opacity:.15}}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiers div{background:rgba(255,255,255,.07);border-radius:14px;padding:8px 4px;font-size:13px;color:var(--dim)}
.tiers b{display:block;font-family:var(--f-data);font-size:17px;color:var(--snow)}
.tiers .gx{display:flex;justify-content:center;gap:2px;font-size:20px;color:var(--berry);margin-bottom:2px}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gbox{aspect-ratio:1;max-width:100%;border-radius:18px;background:rgba(255,255,255,.08);border:2px solid var(--line);display:grid;place-items:center;font-size:clamp(40px,13vw,58px);position:relative;transition:transform .12s}
.gbox:active{transform:scale(.94)}
.gbox.open{background:rgba(255,204,77,.16);border-color:var(--gold)}
.gbox.rest{opacity:.5}
/* v11 reveal like the fox game: total first → the other boxes open one by one → a box worth more than ours glows */
.gbox.rest.in{animation:restIn .24s ease-out}
@keyframes restIn{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
#grid9 .gbox.tease{opacity:1;border-color:var(--berry);background:rgba(226,58,78,.22);box-shadow:0 0 0 2px var(--berry),0 0 14px rgba(226,58,78,.75);animation:tease 1s ease-in-out infinite}
#grid9 .gbox.tease .amt{color:#fff}
@keyframes tease{0%,100%{box-shadow:0 0 0 2px var(--berry),0 0 6px rgba(226,58,78,.45)}50%{box-shadow:0 0 0 2px var(--berry),0 0 22px rgba(226,58,78,.95)}}
#pickSub.rv{min-height:2.7em}   /* two lines kept free while picking, so the boxes do not jump when "so close" appears */
#pickSub b{display:inline-block;line-height:1;font-family:var(--f-data);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
#pickSub.sum{color:var(--snow)}
#pickSub.sum b{font-size:1.25em;animation:sumIn .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes sumIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#pickSub .miss,#pickSub.miss{color:#ff9aa6}
#pickSub.miss{font-size:13.5px}
.gbox .amt{font-family:var(--f-data);font-size:clamp(22px,7vw,30px);font-weight:700;color:var(--gold)}
.gbox .amt.zero{font-family:var(--f-display);font-size:15px;font-weight:500;color:var(--dim)}
.gbox:disabled{cursor:default}
.coupon{border-radius:18px;padding:12px;background:linear-gradient(135deg,#b3122f,#e23a4e);border:2px dashed rgba(255,255,255,.7)}
.coupon .big{color:#fff}
.coupon{animation:couponIn .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes couponIn{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
/* ฿150–250: gold frame that glows · ฿300: a gold coupon */
.coupon.good{border-style:solid;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,204,77,.35),0 0 26px rgba(255,204,77,.7)}
.coupon.jackpot{background:linear-gradient(135deg,#fff0b3,#ffc531 55%,#ff9d1e);border:2px solid #fff6cf;color:#4a2b00;box-shadow:0 0 0 3px rgba(255,204,77,.5),0 0 34px rgba(255,204,77,.95)}
.coupon.jackpot .big{color:#a3142c}
.coupon.jackpot .note{color:#4a2b00!important}
/* confetti for the better endings */
#fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:9}
#fx i{position:absolute;top:-4vh;width:9px;height:14px;border-radius:2px;animation:confetti linear forwards}
@keyframes confetti{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(112vh) rotate(720deg)}}
/* ฿300 jackpot: full-screen celebration over the 3D stage */
#jackpot{display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;cursor:pointer;
  background:linear-gradient(180deg,rgba(10,16,48,.72) 0%,rgba(10,16,48,.15) 36%,rgba(10,16,48,0) 60%,rgba(10,16,48,.85) 100%)}
.jp-top{margin-top:5vh;display:flex;flex-direction:column;align-items:center;gap:2px}
.jp-k{font-size:clamp(30px,9.5vw,54px);line-height:1.2;font-weight:700;color:#fff;text-shadow:0 0 18px rgba(255,204,77,.95),0 3px 0 #b3122f}
.jp-amt{font-family:var(--f-data);font-size:clamp(76px,25vw,132px);line-height:1;font-weight:700;color:var(--gold);text-shadow:0 0 34px rgba(255,204,77,.9),0 5px 0 #a86a00;animation:jpPulse .9s ease-in-out infinite}
.jp-s{font-size:clamp(15px,4.4vw,20px);font-weight:500;text-shadow:0 2px 8px rgba(0,0,0,.8)}
@keyframes jpPulse{50%{transform:scale(1.07)}}
.jp-bottom{margin-bottom:3vh;width:100%}
.jp-tap{font-size:17px;font-weight:500;animation:bob 1.2s infinite;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.jp-bar{width:min(70%,280px);height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;margin:12px auto 0}
.jp-bar i{display:block;height:100%;width:0;background:var(--gold)}
button.proto{cursor:pointer;min-height:34px;font-family:inherit}
.lb{display:flex;flex-direction:column;gap:5px;text-align:left}
.lb .r{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.07);font-size:16px}
.lb .r b{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.lb .r .n{font-family:var(--f-data);font-weight:700;color:var(--dim)}
.lb .r.top .n{color:var(--gold)}
.lb .r.me{background:rgba(255,204,77,.2);border:1px solid var(--gold)}
.lb .r span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fail{display:flex;align-items:center;justify-content:center;text-align:center}
/* ---------- ตัวจริง (LIVE): ด่านตรวจสิทธิ์ · คูปอง QR · แถบทดสอบ ---------- */
#note{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translate(-50%,-140%);max-width:88%;padding:9px 18px;border-radius:999px;background:linear-gradient(180deg,#ffe38a,#ffb92e);color:#3a2400;font-weight:500;font-size:15px;text-align:center;z-index:30;opacity:0;transition:transform .25s,opacity .25s;pointer-events:none}
#note.on{opacity:1;transform:translate(-50%,0)}
.prize.mine{cursor:pointer;background:linear-gradient(135deg,#b3122f,#e23a4e);border-color:#fff;color:#fff;box-shadow:0 0 16px rgba(226,58,78,.6)}
.prize.mine svg{color:#fff}
.gbox.sel{border-color:var(--gold);background:rgba(255,204,77,.22);transform:scale(.94);box-shadow:0 0 0 3px rgba(255,204,77,.35)}
.grid9.busy .gbox:not(.sel):not(.open){opacity:.45}
.glogo{align-self:center;height:54px;border-radius:12px}
.spin{align-self:center;width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.22);border-top-color:var(--gold);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-line{align-self:center;min-height:52px;padding:10px 30px;border-radius:999px;background:#06c755;color:#fff;font-size:20px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center}
.gid{font-size:10px;color:var(--dim);opacity:.6;word-break:break-all}
.qr{align-self:center;padding:10px;background:#fff;border-radius:14px;min-width:150px;min-height:150px;display:grid;place-items:center;color:#7a4a00;font-size:13px}
.qr img,.qr canvas{display:block}
.code{font-family:var(--f-data);font-size:22px;font-weight:700;letter-spacing:.06em;color:var(--gold);user-select:all;-webkit-user-select:all}
#mine.used .qr{opacity:.25}
#mine.used .coupon{filter:grayscale(.7)}
#mineTest{display:inline-block;padding:0 8px;border-radius:8px;background:#fff;color:#b3122f;font-weight:800}
.card{box-sizing:border-box}
.chips{gap:6px}
.chips .btn-ghost{min-height:34px;padding:4px 11px;font-size:13px}
.card h2{font-size:clamp(19px,6.4vw,26px)}
#pick .card h2{white-space:nowrap;font-size:clamp(18px,5.6vw,26px)}
@media (max-width:380px){ .btn-main.sm{padding:8px 20px;font-size:18px} .btn-ghost{padding-inline:14px} #pickBtns{flex-wrap:nowrap} }

async function liveStart(){
  if(startBusy) return;
  if(pending && !coupon){ openPick(pending.score, pending.opens); return; }

  try{
    Net.saveReset();
    const rid = Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
    const j = await Net.retry(() => Net.api('start', { src: Net.src, rid }));
    if(j.route){   // มีรอบค้างอยู่ที่เซิร์ฟเวอร์ (ออกกลางคัน / เปิดอีกเครื่อง)
      let d = j.route;
      if(d.stage === 'playing'){ const e = await Net.retry(() => Net.api('end', { stats: { score: d.score || 0, secs: 0 } })); d = e.pick || e.route || d; if(e.pick) notice(t('resumed')); }
      setDoc(d);

      return;
    }

async function liveFinish(){
  const sc = S.score, stats = { score: sc, secs: Math.round(S.pt), gifts: S.gifts, stars: S.stars, cheers: S.cheers };

    }

/* กล่องของขวัญ 9 ใบ: ลูกค้าเลือกให้ครบก่อน แล้วเซิร์ฟเวอร์เป็นคนบอกว่าในกล่องมีอะไร (เครื่องลูกค้าไม่รู้ล่วงหน้า) */
function livePick(score, n){
  const grid = $('grid9'), sel = []; let busy = false; grid.innerHTML = ''; grid.classList.remove('busy'); pickDemo = false; pickReset();
  $('coupon').hidden = true; $('pickBtns').hidden = true; $('btnPickRetry').hidden = true;
  $('pickTitle').textContent = t('pickTitle', { n }); $('pickSub').textContent = t('pickSub');
  const send = async () => {
    busy = true; grid.classList.add('busy'); $('btnPickRetry').hidden = true; $('pickSub').textContent = t('opening');
    try{
      let j;
      try{ j = await Net.retry(() => Net.api('pick', { picks: sel })); }
      catch(e){ if(e.status === 400 || e.status === 409){ const s = await Net.api('state'); if(s.doc && s.doc.stage === 'done') j = { route: s.doc }; else throw e; } else throw e; }   // เปิดไปแล้วจากอีกเครื่อง → ใช้ผลเดิม
      const d = j.done || j.route; setDoc(d); revealBoxes(d);
    }catch(e){
      if(e.status === 401){ gate('err'); return; }
      $('pickSub').textContent = t('netPick'); const b = $('btnPickRetry'); b.textContent = t('retry'); b.hidden = false; b.onclick = () => { Sound.click(); send(); };
    }
  };
  for(let i = 0; i < 9; i++){
    const b = document.createElement('button'); b.className = 'gbox'; b.style.color = boxColors[i]; b.innerHTML = ic('gift'); b.setAttribute('aria-label', 'gift ' + (i + 1));
    b.onclick = () => {
      if(busy || sel.includes(i) || sel.length >= n) return;
      sel.push(i); b.classList.add('sel'); Sound.click();
      if(sel.length < n){ $('pickSub').textContent = t('pickLeft', { n: n - sel.length }); return; }
      send();
    };
    grid.appendChild(b);
  }
  show('pick');
}
function revealBoxes(d){   // เปิดกล่องที่เลือกทีละใบ (ยอดรวมวิ่งตาม) → เฉลยกล่องที่เหลือแบบเกมจิ้งจอก (revealRest) → ฉากจบตามยอด
  const boxes = [...$('grid9').children], picks = d.picks || [], deck = d.deck || [], run = rvRun; let k = 0, sum = 0;
  boxes.forEach((b, i) => { b.disabled = true; if(!picks.includes(i)) b.classList.remove('sel'); });
  const step = () => {
    if(run !== rvRun) return;
    if(k < picks.length){ const i = picks[k++], v = deck[i] || 0, b = boxes[i]; if(b){ b.classList.remove('sel'); b.classList.add('open'); b.innerHTML = amtHtml(v); } sum += v; sumLine(sum, false); Sound.box(); if(v) Sound.star(); else Sound.click(); setTimeout(step, 560); return; }

}
function mineUsed(u){ $('mine').classList.toggle('used', u); $('mineState').textContent = t(u ? 'mineUsed' : 'mineKeep'); }

    if(window.QRCode){ box.innerHTML = ''; const q = innerHeight < 600 ? 150 : innerHeight < 700 ? 176 : 200; new QRCode(box, { text: data, width: q, height: q, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); return; }

    if(n === 6){ const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; document.head.appendChild(s); }
